name: Bug report
description: Something is broken
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: bundle
    attributes:
      label: Diagnostic bundle
      description: >
        Attach the JSON from /doctor → "download JSON". It contains check
        results and versions — never tokens or transaction data. Issues
        without it will be asked for it before triage.
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: docker compose logs app worker (redact anything private)
